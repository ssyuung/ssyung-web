  <!-- ㅁ: bounds x=0..34, y=0..56; four subtly rounded corners -->
  <path d="M4.1 1.5 H29.9 Q32.5 1.5 32.5 4.1 V51.9 Q32.5 54.5 29.9 54.5 H4.1 Q1.5 54.5 1.5 51.9 V4.1 Q1.5 1.5 4.1 1.5 Z" fill="none" stroke="#49372F" stroke-width="3"/>
